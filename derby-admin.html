<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Derby Admin | FishTrack Africa</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f4f1ea; font-family: 'Lato', sans-serif; margin: 0; color: #1a2840; }
        header { background: #1a2840; color: #e8dcc0; padding: 18px 20px; }
        header h1 { margin: 0; font-size: 20px; }
        .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px; }
        .card { background: white; border-radius: 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 18px; }
        .uid-box { font-family: monospace; background: #f4f1ea; padding: 10px 14px; border-radius: 8px; word-break: break-all; font-size: 14px; }
        .catch-row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid #eee; }
        .catch-row img { width: 110px; height: 110px; object-fit: cover; border-radius: 10px; cursor: pointer; flex-shrink: 0; }
        .catch-info { flex: 1; min-width: 0; }
        .catch-name { font-weight: bold; font-size: 17px; }
        .catch-detail { color: #666; font-size: 14px; margin: 4px 0; }
        .btn { border: none; border-radius: 8px; padding: 10px 18px; font-size: 15px; font-weight: bold; cursor: pointer; margin: 4px 6px 0 0; }
        .btn.approve { background: #27ae60; color: white; }
        .btn.reject { background: #e74c3c; color: white; }
        .btn.undo { background: #ddd; color: #1a2840; }
        .badge { font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 12px; }
        .badge.ok { background: #e8f8ef; color: #27ae60; }
        .badge.no { background: #fdeaea; color: #e74c3c; }
        .badge.wait { background: #fdf3e3; color: #e67e22; }
        .tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        .tab { padding: 8px 16px; border-radius: 20px; background: #eee; cursor: pointer; font-weight: bold; font-size: 14px; }
        .tab.active { background: #f39c12; color: white; }
        .empty { color: #999; text-align: center; padding: 20px 0; }
        .warn { background: #fdf3e3; border-left: 4px solid #f39c12; padding: 12px 14px; border-radius: 8px; font-size: 14px; }
        .ok-banner { background: #e8f8ef; border-left: 4px solid #27ae60; padding: 12px 14px; border-radius: 8px; font-size: 14px; }
        #photo-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        #photo-overlay img { max-width: 100%; max-height: 90vh; border-radius: 10px; }
        select { padding: 10px; border-radius: 8px; border: 2px solid #ddd; font-size: 15px; }
    </style>
</head>
<body>
    <header><h1>🎣 FishTrack Derby Admin — weigh-in verification</h1></header>
    <div class="wrap">

        <div class="card" id="status-card">
            <div id="admin-status" class="warn">Checking admin access…</div>
            <p style="font-size:14px; color:#666; margin-bottom:6px; margin-top:14px;">Your device ID (give this to the derby owner to be added as a verifier):</p>
            <div class="uid-box" id="my-uid">…</div>
        </div>

        <div class="card">
            <h2 style="margin-top:0;">Submissions</h2>
            <div class="tabs">
                <div class="tab active" data-filter="pending">⏳ Pending</div>
                <div class="tab" data-filter="approved">✔ Verified</div>
                <div class="tab" data-filter="rejected">✖ Rejected</div>
                <div class="tab" data-filter="all">All</div>
            </div>
            <div id="catch-list"><div class="empty">Loading…</div></div>
        </div>

        <div class="card">
            <h2 style="margin-top:0;">Entries</h2>
            <div id="entry-list"><div class="empty">Loading…</div></div>
        </div>

    </div>

    <div id="photo-overlay" onclick="this.style.display='none'"><img id="photo-overlay-img" alt="catch"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>window.DERBY_ID = new URLSearchParams(location.search).get('derby') || 'gansbaai_galjoen_2026';</script>
    <script src="js/firebase-config.js"></script>
    <script src="js/derby-admin.js"></script>
</body>
</html>
